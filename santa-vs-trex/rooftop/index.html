function itemsFor(){const P=[[[150,2],[40,3],[200,4]],[[60,5],[204,4],[160,0]],[[88,2],[200,5],[24,0]],[[120,166],[30,126],[188,206]],[],[]][ST];
  items=P.map(([x,g],k)=>({x,g:ST===3?find(x,g):g,on:1,k}))}
function resetStage(){pw={};elf=null;balls=[];gifts=[];ammo=3;ammoT=0;ev=null;evT=900;giftT=420;combo=0;fx=[];G=[];foes=[];pops=[];hammer=0;flare=0;retr=false;BUILD[ST]();itemsFor();
  p={x:S.start[0],y:0,g:S.start[1],st:'walk',vy:0,fy:0,f:1,anim:0,sy:0,t:0,jx:0,cl:0,lad:null};if(ST!==4)p.y=gs(p.g,p.x);
  bonus=Math.min(8000,4000+level*1000);rex={t:70,hold:0,n:0,fall:0};state='ready';timer=120}
function die(){if(state!=='play')return;state='dying';timer=150;hammer=0;SFX.die()}
function win(){if(state!=='play')return;state='clear';timer=ST>=3?260:170;addS(bonus,1);SFX.win();if(EX){shake=10;setBanner(ST===4?'GINGERBREAD SLAM!':'STAGE CLEAR!')}}
function saveHi(){if(!demo&&score>hi)hi=score}
function addS(v,nc){if(EX&&!nc){if(fc-lastPt<120)combo++;else combo=1;lastPt=fc;if(combo>1)v*=Math.min(combo,8);if(combo>=3&&combo<=8)setBanner('COMBO x'+combo);if(ev&&ev.k==='DISCO')v*=2}const b=score;score+=v;if(!extra&&b<7000&&score>=7000){extra=1;lives++;SFX.grab();pop('1UP',p.x-8,p.y-34)}}
function pop(v,x,y){pops.push({v,x,y,t:50})}
const hamPos=()=>((fc>>3)&1)?{x:p.x+p.f*3,y:p.y-22}:{x:p.x+p.f*11,y:p.y-8};
const hitCR=(cx,cy,r,rx,ry,rw,rh)=>{const nx=clamp(cx,rx,rx+rw),ny=clamp(cy,ry,ry+rh);return(cx-nx)**2+(cy-ny)**2<r*r};
const hamY=h=>gs(h.g,h.x)-24;
const diff=()=>Math.min(7,level+Math.floor((S.tm||0)/1800));
const mult=()=>Math.min(1.9,1+.12*(diff()-1));

// ---- player: fixed jump arc, whole-pixel steps ----
function landAt(py,ny){for(let i=0;i<G.length;i++){if(!inG(i,p.x))continue;const gy=gs(i,p.x);if(py<=gy+1&&ny>=gy)return i}return -1}
function land(i){p.y=gs(i,p.x);p.g=i;if(p.y-p.sy>12){die();return}p.st='walk';
  if(p.cl){const v=p.cl===1?100:p.cl===2?300:800;addS(v);pop(v,p.x-10,p.y-28);SFX.pt()}p.cl=0;if(G[i][4].goal)win()}
function upPlayer(){if(EX&&pw.stun>0)return;const ix=inp.x,iy=inp.y,ck=EX&&pw.cocoa>0;
  if(p.st==='walk'){
    if(hammer<=0&&iy){const l=L.find(l=>ladOK(l)&&(iy<0?l[1]:l[2])===p.g&&Math.abs(p.x-l[0])<=3);if(l){p.st='climb';p.lad=l;p.x=l[0];if(iy>0)p.y+=1;return}}
    if(jp&&hammer<=0){p.st='jump';p.t=0;p.jx=ix;if(ix)p.f=ix;p.sy=p.y;p.cl=0;SFX.jump();return}
    const slow=ST===4&&S.pud.some(q=>q.t>=50&&q.g===p.g&&Math.abs(q.x-p.x)<8);
    if(ix){p.f=ix;if(slow?fc%3===0:(ck||fc%4)){p.x+=ix;p.anim++;if(p.anim%8===0)SFX.step()}}
    const cv=G[p.g][4].conv;if(cv&&fc%2===0)p.x+=cv;
    p.x=clamp(p.x,4,220);
    const g=segAt(p.g,p.x,p.y);if(g<0){p.st='fall';p.vy=0;p.fy=p.y;p.sy=p.y;return}
    p.g=g;p.y=gs(p.g,p.x);
  }else if(p.st==='climb'){const l=p.lad,yT=gs(l[2],l[0]),yB=gs(l[1],l[0]);
    if(iy&&(ck||fc%3)){p.y+=iy;p.anim++}
    if(p.y<=yT){p.y=yT;p.g=l[2];p.st='walk';if(G[p.g][4].goal)win()}
    else if(p.y>=yB){p.y=yB;p.g=l[1];p.st='walk'}
  }else if(p.st==='jump'){p.t++;
    if(p.jx&&fc%4){p.x+=p.jx;if(p.x<4||p.x>220){p.jx=-p.jx;p.f=-p.f;p.x=clamp(p.x,4,220)}}
    const py=p.y,ny=Math.round(p.sy-JUMP[Math.min(p.t,239)]);
    if(ny>py){const i=landAt(py,ny);if(i>=0){land(i);return}}
    p.y=ny;
  }else{const py=p.y;p.vy=Math.min(p.vy+.15,3);p.fy+=p.vy;const ny=Math.round(p.fy);
    const i=landAt(py,ny);if(i>=0){land(i);return}p.y=ny}
  if(p.y>H+10){die();return}
  for(const it of items)if(it.on&&p.st!=='climb'&&Math.abs(p.x-it.x)<6&&Math.abs(p.y-gs(it.g,it.x))<14){it.on=0;const v=[300,500,800][Math.min(level,3)-1];addS(v);pop(v,it.x-10,p.y-28);SFX.grab()}
  if(p.st==='jump'||p.st==='walk')for(const h of hams){if(!h.on)continue;const hy=hamY(h);
    if(Math.abs(p.x-h.x)<=5&&p.y-15<=hy+3&&p.y-15>=hy-10){h.on=0;hammer=600;SFX.grab()}}
}
// ---- drums (stage 1): one pixel at a time so ladder choices happen at exact spots ----
function bStep(b){b.x+=b.dir;b.spin+=b.dir;
  if(!inG(b.g,b.x)){b.st='fall';b.vy=0;b.fy=b.y;b.bnc=0;return false}
  b.y=gs(b.g,b.x);
  if(b.g===0&&b.x<=22){b.dead=1;flare=40;if(b.hot)spawnEmber(26,0,1);return false}
  for(const l of L){if(l[2]===b.g&&l[0]===b.x&&l!==b.lad){b.lad=l;let ch=.18+(diff()>2?.07:0);if(p.y>b.y+8&&Math.abs(p.x-l[0])<40)ch+=.3;
    if(Math.random()<ch){b.st='lad';return false}break}}
  return true}
function upDrum(b){
  if(b.st==='plunge'){b.y+=2;b.spin+=.5;const gy=gs(0,b.x);if(b.y>=gy){b.dead=1;flare=40;spawnEmber(26,0,1)}return}
  if(b.st==='wild'){const py=b.y;b.vy=Math.min(b.vy+.12,3);b.fy+=b.vy;b.x+=b.vx;b.spin+=2;if(b.x<8||b.x>216)b.vx=-b.vx;b.y=Math.round(b.fy);
    for(let i=b.lb-1;i>=0;i--){if(!inG(i,b.x))continue;const gy=gs(i,b.x);if(py<=gy&&b.y>=gy){b.lb=i;b.fy=b.y=gy;
      if(i===0){b.st='roll';b.g=0;b.dir=-1}else{b.vy=-1.6;b.vx=(p.x>b.x?1:-1)*(.5+Math.random()*.5)}break}}
    if(b.y>H+16)b.dead=1;return}
  if(b.st==='roll'){const d=diff(),n=1+(d>1&&fc%Math.max(2,6-d)===0?1:0);for(let k=0;k<n;k++)if(!bStep(b))break}
  else if(b.st==='lad'){b.y+=1;b.spin+=.5;const yB=gs(b.lad[1],b.x);if(b.y>=yB){b.y=yB;b.g=b.lad[1];b.st='roll';b.dir=dirOf(b.g)}}
  else{const py=b.y;b.vy=Math.min(b.vy+.15,3);b.fy+=b.vy;if(fc%2)b.x+=b.dir;const ny=Math.round(b.fy);
    for(let i=b.bnc?b.g:b.g-1;i>=0;i--){if(!inG(i,b.x))continue;const gy=gs(i,b.x);if(py<=gy&&ny>=gy){
      if(!b.bnc){b.bnc=1;b.g=i;b.vy=-1.3;b.fy=gy;b.y=gy;b.dir=dirOf(i);return}
      b.y=gy;b.st='roll';b.lad=null;return}}
    b.y=ny;if(b.y>H+16||b.x<-12||b.x>W+12)b.dead=1}}
// ---- embers: hunt you along floors and ladders ----
function spawnEmber(x,g,dir){const max=ST===1?Math.min(5,2+level):ST===3?Math.min(5,2+level):Math.min(4,1+(level>>1));
  if(foes.filter(f=>f.t==='ember').length>=max)return;foes.push({t:'ember',x,y:gs(g,x),g,st:'walk',dir,lad:null,tm:60,hop:20})}
function upEmber(e){if(e.hop>0){e.hop--;return}
  if(e.st==='walk'){
    if(hammer>0&&Math.abs(p.y-e.y)<6&&fc%30===0)e.dir=p.x<e.x?1:-1;
    if(--e.tm<=0){e.tm=60+(Math.random()*90|0);e.dir=hammer>0&&Math.abs(p.y-e.y)<6?(p.x<e.x?1:-1):(Math.abs(p.y-e.y)<6&&Math.random()<.65)?(p.x<e.x?-1:1):(Math.random()<.5?-1:1)}
    if(fc%2)return;
    const nx=e.x+e.dir,ng=segAt(e.g,nx,e.y);
    if(ng<0||nx<4||nx>220||(S.fur&&Math.abs(nx-S.fur.x)<12&&Math.abs(e.y-S.fur.f)<4)){e.dir=-e.dir;return}
    e.x=nx;e.g=ng;e.y=gs(e.g,e.x);if(e.lad&&Math.abs(e.x-e.lad[0])>6)e.lad=null;
    for(const l of L){if(!ladOK(l)||l[0]!==e.x||l===e.lad)continue;
      if(l[1]===e.g&&!G[l[2]][4].goal&&p.y<e.y-10&&Math.random()<.5){e.st='climb';e.cd=-1;e.lad=l;return}
      if(l[2]===e.g&&p.y>e.y+10&&Math.random()<.4){e.st='climb';e.cd=1;e.lad=l;e.y+=1;return}}
  }else{if(fc%3===0)return;e.y+=e.cd;const l=e.lad,yT=gs(l[2],l[0]),yB=gs(l[1],l[0]);
    if(e.y<=yT){e.y=yT;e.g=l[2];e.st='walk'}else if(e.y>=yB){e.y=yB;e.g=l[1];e.st='walk'}}}
// ---- tar pails (stage 2): ride the belts ----
function upCan(c){if(fc%2===0)c.x+=G[c.g][4].conv;if(!inG(c.g,c.x)){c.dead=1;if(S.fur&&Math.abs(c.x-S.fur.x)<16)flare=20}}
// ---- springs (stage 3): hop along the top beam, then drop down the right side ----
function upSpring(s){if(s.st==='hop'){s.x+=1.2*mult();s.ph+=Math.PI/28;const k=Math.abs(Math.sin(s.ph));s.y=64-20*k;if(k<.06&&!s.snd){SFX.boing();s.snd=1}if(k>.5)s.snd=0;if(s.x>=212){s.st='drop';s.x=212}}
  else{s.y+=2.6;if(s.y>H+12)s.dead=1}}
function moveElev(sp){S.et+=sp;for(const i of S.el){const o=G[i][4],off=((S.et+o.k*42)%168+168)%168,y=Math.round(o.elev<0?252-off:84+off),old=G[i][2];
  G[i][2]=G[i][3]=y;if(old&&Math.abs(y-old)>50&&p.g===i&&p.st==='walk')die()}}

function upRexChase(){const r=S.rex;if(r.stuck)return;const sp=Math.min(.95,.55+.06*diff()),cx=r.x+14;
  if(r.st==='walk'){let tx=p.x;
    if(Math.abs(p.y-r.f)>=6){const up=p.y<r.f,ls=L.filter(l=>up?l[1]===r.g:l[2]===r.g);
      if(ls.length){const l=ls.reduce((a,b)=>Math.abs(a[0]-cx)<=Math.abs(b[0]-cx)?a:b);tx=l[0];
        if(Math.abs(cx-tx)<1){r.st='climb';r.lad=l;r.cd=up?-1:1;r.x=l[0]-14;return}}}
    r.acc+=sp;while(r.acc>=1){r.acc--;const d=Math.sign(tx-(r.x+14));if(d){r.d=d;r.x+=d}}
    r.x=clamp(r.x,-2,198);
    for(const q of S.pud)if(q.t>=50&&q.g===r.g&&Math.abs(q.x-(r.x+14))<9){r.stuck=1;SFX.smash();win();return}
  }else{r.acc+=sp*.8;while(r.acc>=1){r.acc--;r.f+=r.cd}const l=r.lad,yT=G[l[2]][2],yB=G[l[1]][2];
    if(r.f<=yT){r.f=yT;r.g=l[2];r.st='walk'}else if(r.f>=yB){r.f=yB;r.g=l[1];r.st='walk'}}}
function chaseUpdate(){upRexChase();if(state!=='play')return;
  for(const b of S.bk)if(b.on&&p.st==='walk'&&p.g===b.g&&Math.abs(p.x-b.x)<5){b.on=0;S.pud.push({x:b.x,g:b.g,t:0});SFX.boing()}
  for(const q of S.pud)q.t++;S.pud=S.pud.filter(q=>q.t<700);
  if(S.bk.every(b=>!b.on)&&!S.pud.length){if(++S.bkT>120){S.bk.forEach(b=>b.on=1);S.bkT=0}}
  if(--S.icT<=0){S.icT=Math.max(120,320-diff()*25);for(let k=0;k<1+(diff()>2);k++)S.ic.push({x:12+(Math.random()*200|0),y:40,w:45})}
  for(const c of S.ic){if(c.w>0){c.w--;continue}c.y+=2.5;if(Math.abs(c.x-p.x)<4&&c.y>p.y-15&&c.y-8<p.y){die();return}}
  S.ic=S.ic.filter(c=>c.y<H+10)}
function stageUpdate(){const r=S.rex;if(ST===4){chaseUpdate();return}
  if(ST===0){if(rex.hold>0){if(--rex.hold===0){rex.n++;const y5=gs(5,46);
      if(rex.n===1)foes.push({t:'drum',x:22,y:y5,g:5,dir:1,st:'plunge',spin:0,hot:1});
      else if(diff()>=2&&Math.random()<.18)foes.push({t:'drum',x:46,y:y5,fy:y5,g:5,dir:1,st:'wild',vx:p.x>46?.8:.5,vy:-1,lb:5,spin:0,hot:rex.n%5===2});
      else foes.push({t:'drum',x:46,y:y5,g:5,dir:1,st:'roll',spin:0,vy:0,fy:0,hot:rex.n%5===2,mega:rex.mega?(rex.mega=0,1):0});SFX.thr()}}
    else if(--rex.t<=0||(EX&&pw.tiny>0&&fc%2&&false)){rex.hold=26;rex.t=Math.max(50,150-diff()*14)+Math.random()*70}}
  if(ST===1){
    if(--S.canT<=0){S.canT=Math.max(40,110-level*10)+(Math.random()*50|0);const opts=[[2,1],[222,2],[108,5],[116,6]],o=opts[Math.random()*4|0];
      if(!(p.g===o[1]&&Math.abs(p.x-o[0])<20))foes.push({t:'can',x:o[0],y:gs(o[1],o[0]),g:o[1]})}
    if(--S.embT<=0){S.embT=360+(Math.random()*200|0);flare=40;const l=Math.random()<.5;spawnEmber(l?96:128,l?1:2,l?-1:1)}
    if(--S.flipT<=0){S.flipT=300+(Math.random()*240|0);G[7][4].conv*=-1}
    if(--S.retT<=0){retr=!retr;S.retT=retr?150:220}}
  if(ST===2){moveElev(.5*mult());if(state!=='play')return;
    if(rex.hold>0){if(--rex.hold===0){foes.push({t:'spring',x:44,y:64,ph:0,st:'hop'});SFX.thr()}}
    else if(--rex.t<=0){rex.hold=20;rex.t=Math.max(70,130-level*10)+Math.random()*60}}
  if(ST===3){if(fc%3===0){r.x+=r.d;if(r.x<=92||r.x>=104)r.d=-r.d}
    if(--S.embT<=0){S.embT=Math.max(160,320-level*30)+(Math.random()*120|0);
      const segs=G.map((g,i)=>i).filter(i=>i>0&&!G[i][4].rivet&&!G[i][4].deco&&!G[i][4].gone&&G[i][1]-G[i][0]>=24);
      for(let k=0;k<6;k++){const i=segs[Math.random()*segs.length|0],x=G[i][0]+8+(Math.random()*(G[i][1]-G[i][0]-16)|0);
        if(Math.abs(x-p.x)+Math.abs(gs(i,x)-p.y)>70&&!(i===find(100,86))){spawnEmber(x,i,Math.random()<.5?-1:1);break}}}
    let left=0;for(const i of S.rivets){const g=G[i][4];if(g.gone)continue;left++;const cx=G[i][0]+4,inside=p.x>=G[i][0]-1&&p.x<=G[i][1]&&G[i][2]-p.y>=0&&G[i][2]-p.y<=20&&p.st!=='climb';
      if(g.was&&!inside&&!(p.g===i&&p.st==='walk')){g.gone=1;left--;addS(100);pop(100,cx-10,G[i][2]-30);SFX.pop()}g.was=inside}
    if(!left)win()}
}
function play(){if(ST===4){scrollPlay();return}if(ST===5){catchPlay();return}
  if(pp){paused=!paused}if(paused)return;S.tm=(S.tm||0)+1;
  upPlayer();if(state!=='play')return;
  if(hammer>0)hammer--;if(flare>0)flare--;
  stageUpdate();if(state!=='play')return;
  if(EX){exLadder();if(state!=='play')return}
  for(const f of foes){if(EX&&ev&&ev.k==='BLIZZARD'&&fc%2)continue;if(f.t==='drum')upDrum(f);else if(f.t==='ember')upEmber(f);else if(f.t==='can')upCan(f);else upSpring(f)}
  const r=S.rex,tn=EX&&pw.tiny>0;if(p.x>r.x+(tn?9:3)&&p.x<r.x+(tn?21:27)&&p.y>r.f-(tn?12:24)&&p.y-13<r.f){if(hurt())return}
  for(const b of foes){if(b.dead)continue;const sp=b.t==='spring',bx=b.x,by=b.y-(sp?6:b.mega?7:5);
    if(hammer>0&&!sp){const h=hamPos();if(Math.abs(h.x-bx)<8&&Math.abs(h.y-by)<8){b.dead=1;const v=b.t==='ember'?500:[300,500,800][Math.random()*3|0];addS(v);pop(v,bx-8,by-6);SFX.smash();continue}}
    if(hitCR(bx,by,sp?5:b.mega?6:4,p.x-3,p.y-13,6,12)){if(EX&&pw.tinsel>0&&!sp){b.dead=1;addS(200);pop(200,bx-8,by-6);burst(bx,by,8);SFX.smash();continue}if(hurt())return;continue}
    if(!sp&&(p.st==='jump'||p.st==='fall')&&!b.sc&&Math.abs(bx-p.x)<6&&b.y>p.y&&b.y-p.y<26){b.sc=1;p.cl++;if(b.mega){addS(1000);pop(1000,p.x-14,p.y-32);setBanner('MEGA JUMP!');burst(p.x,p.y,20)}}}
  foes=foes.filter(b=>!b.dead);
  if(fc%120===0){bonus-=100;if(bonus<=0){bonus=0;die();return}}
  if(fc%15===0){if(hammer>0)tone(HAMM[(fc/15|0)%8],.09,'square',.025);else{const n=BASS[(fc/15|0)%32];if(n){tone(n,.12,'square',.03);tone(n/2,.12,'triangle',.05)}if(fc%30===0)tone(2400,.03,'square',.012)}}
}
function step(){readInput();fc++;if(banner&&--banner.n<=0)banner=null;if(shake>0)shake--;if(EX&&state==='clear'&&fc%9===0)burst(30+Math.random()*164,50+Math.random()*80,16);pops.forEach(o=>{o.t--;o.y-=.3});pops=pops.filter(o=>o.t>0);
  if(state==='title'){titleT++;if(inp.y&&inp.y!==lastY){menu=1-menu;EX=menu;loadHS();titleT=0;SFX.step()}lastY=inp.y;if(sp){EX=menu;newGame()}else if(titleT>600)startDemo()}
  else if(demo&&(state==='dying'||state==='clear'||(S.tm||0)>2400)){if(state!=='play'||--timer<=0)endDemo()}
  else if(state==='ready'){if(ST===2)moveElev(.5*mult());if(--timer<=0)state='play'}
  else if(state==='play')play();
  else if(state==='dying'){if(--timer<=0){lives--;if(lives<=0){saveHi();if(!demo&&score>HS[4][1]){state='name';nm={l:[0,0,0],i:0}}else{state='over';timer=200}}else{const s=score;resetStage();score=s}}}
  else if(state==='clear'){if(ST===3)rex.fall+=Math.min(4,rex.fall*.05+.5);if(--timer<=0){si++;if(si>=SEQ(level).length){si=0;level++}ST=SEQ(level)[si];const s=score;resetStage();score=s}}
  else if(state==='name'){const L3='ABCDEFGHIJKLMNOPQRSTUVWXYZ.-';const yv=-inp.y||inp.x;if(yv&&yv!==lastY)nm.l[nm.i]=(nm.l[nm.i]+yv+L3.length)%L3.length;lastY=yv;
    if(jp){nm.i++;SFX.pt();if(nm.i>2){HS.push([nm.l.map(c=>L3[c]).join(''),score]);HS.sort((a,b)=>b[1]-a[1]);HS=HS.slice(0,5);hi=HS[0][1];saveHS();state='over';timer=200}}}
  else if(state==='over'){timer--;if(timer<140&&sp)state='title';if(timer<=0)state='title'}
  saveHi()}

// ---- drawing ----
const R=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)};

  for(const b of balls){if(b.rain){b.y+=b.vy;if(Math.abs(b.x-s.x)<8&&b.y>s.y-16&&b.y<s.y+2){b.dead=1;addS(100);pop(100,b.x-8,b.y-10);SFX.pt()}if(b.y>H)b.dead=1;continue}
    b.x+=b.vx;b.vy+=.12;b.y+=b.vy;b.t--;if(b.t<=0||solidT(tileAt(b.x,b.y))){b.dead=1;burst(b.x-CH.cam,b.y,5,['#ffffff','#8fd3ff']);continue}
    for(const e of CH.en)if(!e.dead&&!e.sq&&Math.abs(e.x-b.x)<7&&Math.abs(e.y-7-b.y)<9){e.sq=40;b.dead=1;addS(200);pop(200,e.x-8,e.y-24);SFX.smash();break}
    const r=CH.rex;if(!b.dead&&!r.stuck&&Math.abs(b.x-r.x)<14&&b.y>r.y-24&&b.y<r.y){b.dead=1;r.slow=90;addS(50);pop('OUCH',r.x-10,r.y-34);burst(b.x-CH.cam,b.y,8,['#ffffff'])}}
  balls=balls.filter(b=>!b.dead);
  if(elf){elf.x+=((s.x-s.f*12)-elf.x)*.12;elf.y+=(s.y-elf.y)*.2;
    for(const e of CH.en)if(!e.dead&&!e.sq&&Math.abs(e.x-elf.x)<10&&Math.abs(e.y-elf.y)<14){e.sq=40;addS(200);pop(200,e.x-8,e.y-24)}}}
// ---- bonus stage: catch presents dropped from a flying sleigh ----
function buildCatch(){gir(0,224,232,232);L=[];hams=[];S={rex:{x:-999,f:-999,mode:'none'},pr:{x:-99,f:-99},fur:null,start:[112,0],ct:{t:1200,n:0,drops:[],dt:30,sx:-40}}}
function catchPlay(){if(pp){paused=!paused}if(paused)return;exTick();upPlayer();const c=S.ct;c.t--;c.sx+=1.5;if(c.sx>270)c.sx=-50;
  if(--c.dt<=0&&c.sx>10&&c.sx<214){c.dt=10+(Math.random()*14|0);const k=Math.random();c.drops.push({x:c.sx-20,y:52,vy:.5+Math.random()*.6,k:k<.1?'gold':k<.32?'coal':'gift',cl:['#2f9e5b','#2a6f9f','#d62828','#b05cff'][Math.random()*4|0]})}
  for(const d of c.drops){d.y+=d.vy;d.vy=Math.min(2.8,d.vy+.025);
    if(Math.abs(d.x-p.x)<9&&d.y>p.y-18&&d.y<p.y+2){d.dead=1;if(d.k==='coal'){pw.stun=50;shake=8;tone(90,.3,'sawtooth',.06,-40);burst(d.x,d.y,10,['#333','#666'])}else{const v=d.k==='gold'?500:100;c.n++;addS(v);pop(v,d.x-8,d.y-14);SFX.pt();burst(d.x,d.y,6)}}
    if(d.y>236){d.dead=1;if(d.k!=='coal')burst(d.x,232,4,['#ffffff'])}}
  c.drops=c.drops.filter(d=>!d.dead);
  if(fc%15===0){const n=BASS[(fc/15|0)%32];if(n){tone(n*2,.08,'square',.03);tone(n/2,.1,'triangle',.05)}}
  if(c.t<=0){state='clear';timer=220;addS(c.n*50,1);SFX.win();setBanner(c.n>=30?'GIFT MASTER!':'NICE CATCHING!')}}
function reindeer(x,y){x=Math.round(x);y=Math.round(y);for(let k=0;k<2;k++){const rx=x+k*16,b=(fc>>3)&1;R(rx,y,10,5,'#8b5a2b');R(rx+9,y-3,4,4,'#8b5a2b');R(rx+12,y-2,2,1,'#1a1a1a');R(rx+10,y-6,1,3,'#d9b98a');R(rx+12,y-7,1,4,'#d9b98a');R(rx+9,y-7,2,1,'#d9b98a');R(rx+1,y+5,1,3-b,'#5a3a1a');R(rx+8,y+5,1,2+b,'#5a3a1a');R(rx+3,y+1,4,1,'#d62828')}
  R(x-22,y-2,18,8,'#d62828');R(x-24,y+6,24,2,'#ffd23f');R(x-22,y-4,4,2,'#d62828');spr(ELFS,x-14,y-12);R(x-4,y+2,4,1,'#ffd23f')}
function giftBox(x,y,cl){R(x-4,y-8,8,8,cl);R(x-1,y-8,2,8,'#ffd23f');R(x-4,y-5,8,2,'#ffd23f');R(x-3,y-10,2,2,'#ffd23f');R(x+1,y-10,2,2,'#ffd23f')}
function drawExtra(){const cam=ST===4&&CH?CH.cam:0;
  if(ev&&ev.k==='BLIZZARD')for(let i=0;i<90;i++){const x=(i*37+fc*3)%240-8,y=(i*61+fc*(2+i%3))%256;R(x,y,i%4?1:2,1,'#e8f4ff')}
  if(ev&&ev.k==='REINDEER')reindeer(ev.x,40);
  for(const g of gifts){if(g.t<120&&(fc>>2)&1)continue;giftBox(g.x,g.y,`hsl(${(fc*6+g.x)%360},80%,50%)`);if((fc>>3)&1)R(g.x+4,g.y-12,1,1,'#fff')}
  for(const b of balls){if(b.rain){giftBox(b.x-cam,b.y,'#2f9e5b');continue}R(b.x-cam-2,b.y-2,4,4,'#ffffff');R(b.x-cam-1,b.y-1,1,1,'#bfe6ff')}
  if(ST===4&&CH)for(const k of CH.cc)if(k.on&&k.pw)giftBox(k.x-cam,k.y,`hsl(${fc*6%360},80%,50%)`);
  if(elf)spr(ELFS,elf.x-(ST===4?cam:0)-4,elf.y-10+((fc>>3)&1),(ST===4?CH.s.f:p.f)<0);
  const q=ST===4&&CH?{x:CH.s.x-cam,y:CH.s.y}:p;
  if(state==='play'||state==='ready'){if(pw.shield){ctx.strokeStyle=(fc>>3)&1?'#8fd3ff':'#ffffff';ctx.beginPath();ctx.arc(q.x,q.y-8,12,0,6.28);ctx.stroke()}
    if(pw.tinsel>0){ctx.strokeStyle=`hsl(${fc*15%360},90%,60%)`;ctx.strokeRect(q.x-8.5,q.y-18.5,17,19)}
    if(pw.stun>0)txt('*',q.x-3,q.y-26+((fc>>2)&1),'#ffd23f')}
  for(const f of fx){f.x+=f.vx;f.y+=f.vy;f.vy+=.05;f.t--;R(f.x-cam,f.y,2,2,f.c)}fx=fx.filter(f=>f.t>0);
  if(ST===5){const c=S.ct;reindeer(c.sx,40);for(const d of c.drops){if(d.k==='coal'){R(d.x-4,d.y-6,8,6,'#2b2b2b');R(d.x-2,d.y-7,4,1,'#444')}else if(d.k==='gold'){giftBox(d.x,d.y,'#ffd23f');R(d.x-5,d.y-11,1,1,'#fff')}else giftBox(d.x,d.y,d.cl)}
    txt('TIME '+Math.max(0,Math.ceil(c.t/60)),8,30,'#ffd23f');txt('GIFTS '+c.n,140,30,'#5fe08a')}
  for(let i=0;i<3;i++){R(132+i*7,23,4,4,i<ammo?'#ffffff':'#3b4a7a')}
  const lab=pw.tinsel>0?'TINSEL':pw.cocoa>0?'COCOA':pw.tiny>0?'TINY':elf?'ELF':pw.shield?'SHIELD':'';if(lab&&ST!==5)txt(lab,4,36,`hsl(${fc*8%360},90%,65%)`);
  if(banner){const k=Math.min(1,(100-banner.n)/8),y=96+Math.round(Math.sin(fc/6)*2);ctx.save();ctx.translate(112,y);ctx.scale(k,k);
    const t=banner.t,w=t.length*8+12;R(-w/2,-4,w,18,'#070d22cc');txt(t,0,1,banner.c||`hsl(${fc*10%360},95%,65%)`,8,'center');ctx.restore()}}
function exDisco(){if(!(ev&&ev.k==='DISCO'))return;ctx.fillStyle=`hsla(${fc*4%360},90%,50%,.16)`;ctx.fillRect(0,0,W,H);
  for(let i=0;i<6;i++){const a=fc/30+i*1.05;R(112+Math.cos(a)*90,120+Math.sin(a)*60,3,3,`hsl(${i*60+fc*5},100%,70%)`)}R(108,0,8,6,'#c9ccd6');R(109,6,6,6,`hsl(${fc*9%360},80%,75%)`)}

let rp=0,lastRun=0;
// crisp whole-number pixel scaling
const scr=document.getElementById('scr');
function fit(){const coarse=matchMedia('(pointer:coarse)').matches,aw=Math.min(innerWidth,560)-48,ah=innerHeight-(coarse?360:210);let s=Math.min(aw/224,ah/256);if(s>=2)s=Math.floor(s);s=Math.max(s,1);scr.style.width=Math.round(224*s)+'px'}
addEventListener('resize',fit);fit();
let acc=0,last=performance.now();
function loop(t){acc+=Math.min(100,t-last);last=t;while(acc>=1000/60){step();acc-=1000/60}draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
}
